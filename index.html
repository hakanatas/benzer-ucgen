<html lang="tr">
<head>

<title>Benzer Üçgen İçin Ne Yeter?</title>
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="seal" aria-hidden="true"><span>∼</span></div>
    <div class="titles">
      <h1>Benzer Üçgen İçin Ne Yeter? <em>What makes triangles similar</em></h1>
      <p>8. sınıf matematik · Benzer üçgen oluşturmak için yeterli elemanlar (MAT.8.3.4) · Nokta ile 92 saniye</p>
    </div>
    <div class="now">
      <div class="now-scene" id="sceneName">—</div>
      <div class="now-concept" id="sceneConcept">—</div>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="frame" id="frame"><canvas id="film" width="1920" height="1080"></canvas>
      <div class="loading" id="loading">mürekkep hazırlanıyor…</div>
    </div>
  </main>
  <section class="controls">
    <div class="row transport">
      <button id="restart" class="icon" title="Başa dön (Home)" aria-label="Başa dön"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5 9 12l10 7z"/></svg></button>
      <button id="play" class="play" title="Oynat / Duraklat (Boşluk)" aria-label="Oynat">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
      <div class="time"><span id="tc">00:00.00</span><small>/ 01:32.00</small></div>
      <div class="scrub" id="scrub"><div class="track"><div class="fill" id="fill"></div></div><div class="markers" id="markers"></div><div class="head" id="head"></div></div>
    </div>
    <div class="row options">
      <label class="grp"><span>Sahne</span><div class="seg" id="scenes"></div></label>
      <label class="grp"><span>Hız</span><div class="seg" id="speeds"></div></label>
      <label class="grp"><span>Biçim</span><div class="seg" id="formats"></div></label>
      <label class="grp"><span>Altyazı</span><div class="seg" id="caps"></div></label>
      <button id="srt" class="ghost" title="Altyazı dosyasını indir">.srt ↓</button>
      <button id="png" class="ghost" title="Bu kareyi PNG olarak kaydet">kare ↓</button>
    </div>
  </section>
</div>
